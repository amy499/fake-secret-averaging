# Annotated example of a training config (scripts/train_fsa.py). Every section except name,
# method and model is optional; the values shown are the defaults unless marked otherwise.
# Copied, with resolved values and the git hash, into outputs/training/<run>/config.yaml.

name: gemma3_4b_fsa_k8
seed: 0                  # LoRA init, example draws, random:N layers, sampling

method: fsa              # fsa | b3 | random_layer
model:
  id: gemma3-4b-it       # registry id from configs/training/models.yaml (or an HF id / local path)

target: mixture          # mixture (fsa, random_layer) | no_secret (b3)
reply_source: offline    # offline: frozen-model replies cached on disk | on_policy: adapted model

fsa:
  k: 8                   # fake secrets per example

lora:
  layers: [14, 15, 16, 17]   # NOT the default ("all"): e.g. layers chosen by the patching run
  target_modules: [q_proj, k_proj, v_proj, o_proj]
  rank: 16
  alpha: 32
  dropout: 0.05

secrets:                 # the baseline's split: train only on the train part
  split_seed: 0
  n_train: 50
  n_heldout: 50

prompts:
  train_system_methods: [base]
  train_user_prompts: [rand_20_2digit, rand_10_2digit]
  heldout_user_prompts: [lottery]   # training on it fails at startup

generation:
  max_new_tokens: 128
  temperature: 1.0
  offline_replies_per_prompt: 4

train:
  steps: 200
  lr: 1.0e-4
  warmup_steps: 10
  batch_size: 1
  grad_accum: 4
  gradient_checkpointing: true
  max_grad_norm: 1.0
  weight_decay: 0.0
  dtype: auto
  checkpoint_every: 50

utility:
  weight: 0.0            # lambda: KL(adapted || frozen) on configs/training/prompts.yaml general_prompts.train

monitor:
  every: 10
